# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "CollatzPosDens"
  authors: [Kenny Lau]
  description: >
    `CollatzPosDens` is a formal proof of the main results of *Explicit positive lower density
    for the Collatz Conjecture* (hexagon:2610.00249). It proves Theorem 1.3, an explicit
    positive density of odd starting values reaching a prescribed target $t$ with $3 \nmid t$;
    Remark 1.4, which replaces the odd part of $t$ by $t$ itself when $\gcd(t, 6) = 1$; and
    Corollary 1.2, the case $t = 1$. The Lean files were generated by AxiomProver, Axiom Math's
    in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "Apache-2.0"

repository:
  role: "substantive-development"

sources:
  - title: "Explicit positive lower density for the Collatz Conjecture"
    authors: [Kenny Lau]
    id: "https://hexagonmath.org/2610.00249"
    type: "article"
    location: "Corollary 1.2, Theorem 1.3, Remark 1.4"
    relationship: "formalizes"
    note: >
      Appendix C of the paper documents this repository as the formalization of Theorem 1.3,
      its main result.

classification:
  arxiv: [math.NT]
  msc2020: [11B83, 37P99, 60G50]

status:
  scope: >
    Theorem 1.3, for every target $t$ not divisible by $3$ and every $X \ge X_0(t)$, together
    with Remark 1.4 and Corollary 1.2.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "positive_density_collatz_reaches_one"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
  - declaration: "positive_density_collatz_and_collatzAccel_reaches_one"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
  - declaration: "positive_density_collatz_and_collatzAccel_reaches_of_coprime_six"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
  - declaration: "positive_density_collatz_and_collatzAccel_reaches_of_not_three_dvd"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal challenge in `Challenge/Basic.lean` was checked against the source paper by an
    author of that paper.
