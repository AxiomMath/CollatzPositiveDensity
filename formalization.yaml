version: "v0.4"

project:
  name: "CollatzPosDens"
  authors: [Kenny Lau]
  description: >
    `CollatzPosDens` is a formal proof of the following theorem:
    Let $t$ be a positive integer not divisible by $3$,
    and let $(X_0(t), c(t)) = (2^{t^3D_A}, t^{-4} D_A^{-1})$ where $D_A = 2^{2^{2^{87640}}}$.
    Then, for every $X \ge X_0(t)$, at least $c(t)X$ odd starting values $n < X$
    reach $t$ within $10.46 \log(n/t)$ ordinary steps using the Collatz map
    and reach the odd part of $t$ within $3.4881 \log(n/t)$ accelerated steps using the Syracuse map.
    The Lean files were generated by AxiomProver, Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "Apache-2.0"

repository:
  role: "substantive-development"

classification:
  msc2020: [11B83, 37P99, 03B35]

